<body>
<style>
.layerPop {display: none; position: fixed; top: 0; left: 0; z-index: 1000; width: 100%; height: 100%; background: rgba(0,0,0,0.70);}
.layerPop .inner {position: fixed; top: 50%; left: 50%; overflow: hidden; border-radius: 8px; max-width: 90%; max-height: 90%; background: #fff; transform: translate(-50%, -50%) scale(0); -ms-transform: translate(-50%, -50%) scale(0); -moz-transform: translate(-50%, -50%) scale(0); -webkit-transform: translate(-50%, -50%) scale(0); transition: all 0.2s; -moz-transition: all 0.2s; -webkit-transition: all 0.2s; -o-transition: all 0.2s; box-sizing: border-box;}
.layerPop .inner .tit {display: block; position: absolute; top: 0; left: 0; padding: 16px 60px 16px 30px; width: 100%; line-height: 28px; background: #222222;}
.layerPop .inner .cont {overflow-y: auto; padding: 30px;}
.layerPop .inner .cont.hasbtnFixed {padding-bottom: 90px;}
.layerPop .inner .btnFixed {position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #444444;}
.layerPop .btnClose {display: block; position: absolute; top: 0; right: 30px; width: 30px; height: 30px;} /* text-indent, background */
.layerPop.on .inner {transform: translate(-50%, -50%) scale(1); -ms-transform: translate(-50%, -50%) scale(1); -moz-transform: translate(-50%, -50%) scale(1); -webkit-transform: translate(-50%, -50%) scale(1);}
@media (max-width: 767px) {
    .layerPop .inner {border-radius: 0; width: 100% !important; max-width: inherit; height: 100%; max-height: inherit;}
}
</style>
<button class="btn" onclick="fn_layer('layer01', this, 600)">팝업보기</button>
<div class="layerPop" id="layer01">
    <div class="inner">

            <div class="btnFixed">
                btnFixed

        </div>
        
        <a href="javascript:void(0)" class="btnClose"onclick="fn_layer_close(this)">닫기</a>
    </div>
</div>
<script>
// 레이어 팝업
function fn_layer(e,t,s) {
    if($(".btnFixed").length){
        $('#'+e).find('.cont').addClass("hasbtnFixed");
    }
    $('#'+e).fadeIn(200).addClass('on');
    $('#'+e).find('.inner').css({'width':s+'px'});
    $('body, html').css({'overflow':'hidden'});
    $(t).addClass("backFocusTarget");
    let toh = $('#'+e).find('.inner .tit').outerHeight();
    $('#'+e).find('.inner').css({'padding-top':toh}); // 타이틀 높이
    $('#'+e).find('.cont').css({'max-height':$('#'+e).height()*0.9 - toh});
    $(window).resize(function(){
        if($(window).width() > 767){
			$('#'+e).find('.cont').css({'max-height':$('#'+e).height()*0.9 - toh});
		}else{
			$('#'+e).find('.cont').css({'max-height':$('#'+e).height() - toh});
		}
    });
    $(t).addClass(e);
}

// 레이어 팝업 닫기
function fn_layer_close(t){
	$(t).closest(".inner").parent().fadeOut(200).removeClass("on");
	$("body, html").css({"overflow":"auto"});
	$(".backFocusTarget").focus().removeClass("backFocusTarget");
}
</script>
