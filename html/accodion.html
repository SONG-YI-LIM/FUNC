<style>
.hide {position: absolute; top: -9999px; left: -9999px; overflow: hidden; width: 1px; height: 1px; opacity: 0;}
.accodion ul li {border-bottom: 1px solid #ccc;}
.accodion ul li a {display: block; position: relative; color: #000;}
.accodion ul li a:before {content: ""; position: absolute; top: 0; right: 0; width: 16px; height: 16px; background: url("../assets/images/ico-arrow.png") no-repeat center right/16px auto;}
.accodion ul li a.on:before {transform: rotate(180deg);}
.accodion .acrDiv {display: none;}
.accodion .acrDiv .acrCont {padding: 20px;}
</style>

<script>
// 하나씩 펼치기/닫기    
let acrClc = $('.acrClc');
acrClc.prepend('<span class="hide">펼치기</span>');
acrClc.on('click', function(e){
    e.preventDefault();
    if($(this).hasClass('on')){
        $(this).removeClass('on');
        $(this).find('.hide').text('펼치기');
        $(this).siblings().slideUp(200);
    }else{
        $(this).addClass('on');
        $(this).find('.hide').text('접기');
        $(this).siblings().slideDown(200);
    }
});
